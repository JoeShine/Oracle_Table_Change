version: '3.8'

services:
  oracle-batch-updater:
    build:
      context: .
      dockerfile: Dockerfile
    image: oracle-batch-updater:v2.8.0
    container_name: oracle-batch-updater
    
    # 端口映射
    ports:
      - "6080:6080"  # noVNC Web 端口 (浏览器访问)
      - "5900:5900"  # VNC 端口 (VNC 客户端访问)
    
    # 数据卷挂载
    volumes:
      - ./config.json:/app/config.json          # 配置文件持久化
      - ./logs:/app/logs                         # 日志目录持久化
      - ./data:/app/data                         # 数据目录持久化
      - ./backups:/app/backups                   # 备份目录持久化
      # Oracle Instant Client 挂载（仅库文件，无需配置文件）
      # 将解压后的instantclient_21_15目录挂载到容器
      # - ./instantclient_21_15:/opt/oracle/instantclient_21_15:ro
    
    # 环境变量（Easy Connect方式，无需TNS_ADMIN）
    environment:
      - DISPLAY=:0
      - TZ=Asia/Shanghai
      - LD_LIBRARY_PATH=/opt/oracle/instantclient_21_15:$LD_LIBRARY_PATH
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 重启策略
    restart: unless-stopped
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # 网络配置
    networks:
      - oracle-network
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  oracle-network:
    driver: bridge

# 使用说明:
# ==================
#
# Easy Connect 连接方式（无需配置文件）
# ------------------------------------------
# 在应用界面直接输入连接字符串:
#   格式: host:port/service_name
#   示例: 192.168.1.100:1521/ORCL
#   示例: oracle-server:1521/ORCL.localdomain
#
# 部署步骤:
# ------------------------------------------
# 1. 下载并解压 Oracle Instant Client (仅需Basic包，无需配置文件)
#    wget https://download.oracle.com/otn_software/linux/instantclient/2115000/instantclient-basic-linux.x64-21.15.0.0.0dbru.zip
#    unzip instantclient-basic-linux.x64-21.15.0.0.0dbru.zip
#
# 2. 编辑 docker-compose.yml，取消注释 Oracle 挂载行
#    - ./instantclient_21_15:/opt/oracle/instantclient_21_15:ro
#
# 3. 构建并启动
#    docker-compose build
#    docker-compose up -d
#
# 4. 浏览器访问
#    http://localhost:6080
#
# 5. 在应用中输入 Easy Connect 连接字符串
#    例如: oracle-server:1521/ORCL
#
# 常用命令:
# ==================
# docker-compose up -d        # 启动服务
# docker-compose down         # 停止服务
# docker-compose logs -f      # 查看日志
# docker-compose restart      # 重启服务
# docker-compose exec oracle-batch-updater bash  # 进入容器